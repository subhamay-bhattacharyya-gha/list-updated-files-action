name: "Detect Repository Changes"
description: "Detects added, modified, deleted, renamed, and type-changed files; outputs a JSON summary."

inputs: {}
outputs:
  files-changed:
    description: "Comma-separated list of changed files"
    value: ${{ steps.repo-changes.outputs.files-changed }}
  json-output:
    description: "Base64-encoded JSON object containing categorized file changes"
    value: ${{ steps.repo-changes.outputs.json-output }}
  has-changes:
    description: "Boolean indicator if any files were changed"
    value: ${{ steps.repo-changes.outputs.has-changes }}

runs:
  using: "composite"
  steps:
    - name: Checkout with sufficient history
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Determine diff range and write changed_files.txt
      shell: bash
      run: |
        set -euo pipefail
        # Ensure the file exists no matter what, so later steps don't explode
        : > changed_files.txt

        git fetch --no-tags --prune --depth=0 origin

        EVENT_NAME="${GITHUB_EVENT_NAME:-}"
        DEFAULT_BRANCH="$(git remote show origin | awk '/HEAD branch/ {print $NF}')"

        # Helper: safe_diff writes to changed_files.txt, never fails the step
        safe_diff () {
          local range="$1"
          if git diff --name-status "${range}" > changed_files.txt 2>/dev/null; then
            return 0
          else
            # As a last resort, diff-tree current commit (may be empty)
            git diff-tree --no-commit-id --name-status -r HEAD > changed_files.txt 2>/dev/null || true
          fi
        }

        if [[ "$EVENT_NAME" == "push" ]]; then
          BEFORE="$(jq -r '.before' "$GITHUB_EVENT_PATH")"
          AFTER="$(jq -r '.after' "$GITHUB_EVENT_PATH")"

          if [[ -z "$BEFORE" || "$BEFORE" == "null" || "$BEFORE" =~ ^0+$ ]]; then
            # New branch or unknown parent: compare merge-base with default branch to AFTER
            git fetch origin "${DEFAULT_BRANCH}:${DEFAULT_BRANCH}" || true
            BASE="$(git merge-base "${AFTER}" "origin/${DEFAULT_BRANCH}")" || BASE="$(git rev-parse "${AFTER}^" 2>/dev/null || echo "")"
            if [[ -n "${BASE}" ]]; then
              safe_diff "${BASE}..${AFTER}"
            else
              # Nothing better—emit empty diff
              : > changed_files.txt
            fi
          else
            safe_diff "${BEFORE}..${AFTER}"
          fi

        elif [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "pull_request_target" ]]; then
          BASE_SHA="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
          HEAD_SHA="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          safe_diff "${BASE_SHA}..${HEAD_SHA}"

        else
          safe_diff "origin/${DEFAULT_BRANCH}..HEAD"
        fi

        echo "Using diff (first 5 lines):"
        head -n 5 changed_files.txt || true


    - name: Generate changed_files.json
      id: gen-json
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! -s changed_files.txt ]]; then
          JSON='{"A":[],"M":[],"D":[],"R":[],"T":[]}'
        else
          # Parse name-status with tabs; handle Rxxx old->new and T (type change)
          JSON=$(awk -F '\t' '
            BEGIN { a=m=d=t=""; r="" }
            {
              s=$1
              if (s=="A") { a=a "\"" $2 "\"," }
              else if (s=="M") { m=m "\"" $2 "\"," }
              else if (s=="D") { d=d "\"" $2 "\"," }
              else if (s=="T") { t=t "\"" $2 "\"," }
              else if (s ~ /^R[0-9]*/ ) {
                # rename lines have 3 fields: status, old, new
                r=r "{\"from\":\"" $2 "\",\"to\":\"" $3 "\"},"
              }
            }
            END {
              if (length(a)) a=substr(a,1,length(a)-1)
              if (length(m)) m=substr(m,1,length(m)-1)
              if (length(d)) d=substr(d,1,length(d)-1)
              if (length(t)) t=substr(t,1,length(t)-1)
              if (length(r)) r=substr(r,1,length(r)-1)
              printf "{\n  \"A\":[%s],\n  \"M\":[%s],\n  \"D\":[%s],\n  \"R\":[%s],\n  \"T\":[%s]\n}\n", a, m, d, r, t
            }' changed_files.txt)
        fi
        echo "$JSON" | jq '.' > changed_files.json
        cat changed_files.json

    - name: Print changed files as table summary
      if: always()
      shell: bash
      run: |
        {
          echo "### Changed Files (Grouped by Status)"
          echo "| Status   | File |"
          echo "|----------|------|"
        } >> "$GITHUB_STEP_SUMMARY"

        # Read up to 3 tab-separated fields so we can show renames
        while IFS=$'\t' read -r status col2 col3; do
          [[ -z "${status:-}" || -z "${col2:-}" ]] && continue
          case "$status" in
            A) echo "| ➕ Added    | $col2 |" >> "$GITHUB_STEP_SUMMARY" ;;
            M) echo "| 📝 Modified | $col2 |" >> "$GITHUB_STEP_SUMMARY" ;;
            D) echo "| ❌ Deleted  | $col2 |" >> "$GITHUB_STEP_SUMMARY" ;;
            T) echo "| 🔀 Type Chg | $col2 |" >> "$GITHUB_STEP_SUMMARY" ;;
            R*) echo "| 🔁 Renamed  | $col2 → $col3 |" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
        done < changed_files.txt

    - name: Validate changed_files.json structure
      shell: bash
      run: |
        set -euo pipefail
        jq -e '
          has("A") and has("M") and has("D") and has("R") and has("T")
          and (.A | type=="array")
          and (.M | type=="array")
          and (.D | type=="array")
          and (.T | type=="array")
          and (.R | type=="array")
          and ( .R | all(type=="object" and has("from") and has("to") and (.from|type=="string") and (.to|type=="string")) )
        ' changed_files.json > /dev/null
        echo "JSON schema validation passed ✅"

    - name: Set composite outputs
      id: repo-changes
      shell: bash
      run: |
        set -euo pipefail
        if [[ -s changed_files.txt ]]; then
          # For files-changed, include new paths for renames to keep it simple
          FILE_LIST=$(awk -F '\t' '{
            if ($1 ~ /^R/) print $3; else print $2
          }' changed_files.txt | paste -sd ',' - || true)
          echo "files-changed=${FILE_LIST}" >> "$GITHUB_OUTPUT"
          # Portable base64 (works on macOS too): remove newlines
          JSON_B64=$(base64 changed_files.json | tr -d '\n')
          echo "json-output=${JSON_B64}" >> "$GITHUB_OUTPUT"
          echo "has-changes=true" >> "$GITHUB_OUTPUT"
        else
          echo "files-changed=" >> "$GITHUB_OUTPUT"
          JSON_B64=$(printf %s '{"A":[],"M":[],"D":[],"R":[],"T":[]}' | base64 | tr -d '\n')
          echo "json-output=${JSON_B64}" >> "$GITHUB_OUTPUT"
          echo "has-changes=false" >> "$GITHUB_OUTPUT"
        fi
