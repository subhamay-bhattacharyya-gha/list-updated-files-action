name: "Detect Repository Changes"
description: "Detects added, modified, and deleted files against the default branch and generates a JSON summary."

inputs: {}
outputs:
  files-changed:
    description: "Comma-separated list of changed files"
    value: ${{ steps.repo-changes.outputs.files-changed }}
  json-output:
    description: "Base64-encoded JSON object containing categorized file changes"
    value: ${{ steps.repo-changes.outputs.json-output }}
  has-changes:
    description: "Boolean indicator if any files were changed"
    value: ${{ steps.repo-changes.outputs.has-changes }}

runs:
  using: "composite"
  steps:
    - name: Checkout with sufficient history
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Determine diff range and write changed_files.txt
      shell: bash
      run: |
        set -euo pipefail

        # Full history so we have parents for merge commits
        git fetch --no-tags --prune --depth=0 origin

        EVENT_NAME="${GITHUB_EVENT_NAME:-}"
        DIFF_RANGE=""
        # Prefer explicit SHAs from the event payload when available
        if [[ "$EVENT_NAME" == "push" ]]; then
          BEFORE="$(jq -r '.before' "$GITHUB_EVENT_PATH")"
          AFTER="$(jq -r '.after' "$GITHUB_EVENT_PATH")"
          # Fallback to parent if before is missing (rare)
          if [[ "$BEFORE" == "null" || -z "$BEFORE" ]]; then
            BEFORE="$(git rev-parse HEAD^)"
          fi
          DIFF_RANGE="${BEFORE}..${AFTER}"
        elif [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "pull_request_target" ]]; then
          BASE_SHA="$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")"
          HEAD_SHA="$(jq -r '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          DIFF_RANGE="${BASE_SHA}..${HEAD_SHA}"
        else
          # Manual runs, scheduled, etc.: compare default branch to HEAD
          DEFAULT_BRANCH="$(git remote show origin | awk '/HEAD branch/ {print $NF}')"
          DIFF_RANGE="origin/${DEFAULT_BRANCH}..HEAD"
        fi

        echo "Using diff range: ${DIFF_RANGE}"
        # Name-status tab-delimited output
        git diff --name-status "${DIFF_RANGE}" > changed_files.txt || true
        cat changed_files.txt || true

    - name: Generate changed_files.json
      id: gen-json
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! -s changed_files.txt ]]; then
          JSON='{"A":[],"M":[],"D":[]}'
        else
          JSON=$(awk '
            BEGIN { print "{"; a=m=d="" }
            { s=$1; $1=""; sub(/^\t/,""); f=$0;
              if (s=="A") a=a "\"" f "\",";
              else if (s=="M") m=m "\"" f "\",";
              else if (s=="D") d=d "\"" f "\",";
            }
            END {
              if (length(a)) a=substr(a,1,length(a)-1);
              if (length(m)) m=substr(m,1,length(m)-1);
              if (length(d)) d=substr(d,1,length(d)-1);
              printf "  \"A\":[%s],\n  \"M\":[%s],\n  \"D\":[%s]\n}\n", a, m, d;
            }' changed_files.txt)
        fi
        echo "$JSON" | jq '.' > changed_files.json
        cat changed_files.json
        # Outputs for later steps
        FILE_LIST=$(awk '{print $2}' changed_files.txt | paste -sd ',' - || true)
        echo "files_list=${FILE_LIST}" >> "$GITHUB_OUTPUT"
        echo "json_b64=$(base64 -w 0 changed_files.json)" >> "$GITHUB_OUTPUT"
        if [[ -s changed_files.txt ]]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi

    - name: Print changed files as table summary
      if: always()
      shell: bash
      run: |
        echo "### Changed Files (Grouped by Status)" >> "$GITHUB_STEP_SUMMARY"
        echo "| Status   | File |" >> "$GITHUB_STEP_SUMMARY"
        echo "|----------|------|" >> "$GITHUB_STEP_SUMMARY"
        while IFS=$'\t' read -r status file; do
          [[ -z "${status:-}" || -z "${file:-}" ]] && continue
          case "$status" in
            A) echo "| ➕ Added    | $file |" >> "$GITHUB_STEP_SUMMARY" ;;
            M) echo "| 📝 Modified | $file |" >> "$GITHUB_STEP_SUMMARY" ;;
            D) echo "| ❌ Deleted  | $file |" >> "$GITHUB_STEP_SUMMARY" ;;
          esac
        done < changed_files.txt

    - name: Set composite outputs
      id: repo-changes
      shell: bash
      run: |
        echo "files-changed=${{ steps.gen-json.outputs.files_list }}" >> "$GITHUB_OUTPUT"
        echo "json-output=${{ steps.gen-json.outputs.json_b64 }}" >> "$GITHUB_OUTPUT"
        echo "has-changes=${{ steps.gen-json.outputs.has }}" >> "$GITHUB_OUTPUT"

    - name: Validate changed_files.json structure
      shell: bash
      run: |
        set -euxo pipefail
        if ! jq -e 'has("A") and has("M") and has("D") and (.A | type == "array") and (.M | type == "array") and (.D | type == "array")' changed_files.json > /dev/null; then
          echo "JSON schema validation failed ❌"
          exit 1
        fi
        echo "JSON schema validation passed ✅"

    - name: Print changed files as table summary
      shell: bash
      run: |
        set -euxo pipefail
        echo "### Changed Files (Grouped by Status)" >> "$GITHUB_STEP_SUMMARY"
        echo "| Status   | File |" >> "$GITHUB_STEP_SUMMARY"
        echo "|----------|------|" >> "$GITHUB_STEP_SUMMARY"

        while IFS=$'\t' read -r status file; do
          echo "> Processing: $status $file"
          case "$status" in
            A)
              echo "| ➕ Added    | $file |" >> "$GITHUB_STEP_SUMMARY"
              ;;
            M)
              echo "| 📝 Modified | $file |" >> "$GITHUB_STEP_SUMMARY"
              ;;
            D)
              echo "| ❌ Deleted  | $file |" >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
        done < changed_files.txt

    - name: Set output variables
      id: repo-changes
      shell: bash
      run: |
        set -euxo pipefail
        if [ ! -s changed_files.txt ]; then
          # No changed files detected
          echo "files-changed=" >> "$GITHUB_OUTPUT"
          echo "json-output=changed_files.json" >> "$GITHUB_OUTPUT"
          echo "has-changes=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        FILE_LIST=$(awk '{ print $2 }' changed_files.txt | paste -sd ',' - || echo "")
        echo "files-changed=${FILE_LIST}" >> "$GITHUB_OUTPUT"
        ENCODED_JSON=$(base64 -w 0 changed_files.json)
        echo "json-output=${ENCODED_JSON}" >> "$GITHUB_OUTPUT"
        echo "has-changes=true" >> "$GITHUB_OUTPUT"
